name: Quality Check

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn tsc --noEmit

      - run: yarn lint --max-warnings=0

      - run: yarn test --run

      - run: yarn build